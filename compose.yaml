name: ${COMPOSE_PROJECT_NAME:-opencompute}
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: opencompute
      POSTGRES_DB: opencompute
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make configure}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencompute -d opencompute"]
      interval: 3s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7.4.6-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 30
  nats:
    image: nats:2.11.9-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["127.0.0.1:${NATS_PORT:-4222}:4222"]
    volumes: ["nats-data:/data"]
  storage:
    image: chrislusf/seaweedfs:4.53
    command:
      [
        "mini",
        "-dir=/data",
        "-s3.port=9000",
        "-s3.port.iceberg=0",
        "-s3.port.lance=0",
      ]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Run make configure}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Run make configure}
    ports: ["127.0.0.1:${S3_PORT:-9000}:9000"]
    volumes: ["artifact-data:/data"]
  identity:
    image: quay.io/keycloak/keycloak:26.4.2
    command: ["start-dev", "--import-realm", "--http-port=8081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run make configure}
      KC_HOSTNAME: ${OIDC_ISSUER_BASE:-http://localhost:8081}
      KC_HOSTNAME_STRICT: "false"
      SCHEDULER_CLIENT_SECRET: ${SCHEDULER_CLIENT_SECRET:?Run make configure}
    ports: ["127.0.0.1:${IDENTITY_PORT:-8081}:8081"]
    volumes:
      [
        "identity-data:/opt/keycloak/data",
        "./deploy/compose/realm.json:/opt/keycloak/data/import/realm.json:ro",
      ]
  migrate:
    build:
      context: .
      dockerfile: deploy/compose/Dockerfile
    command: ["pnpm", "migrate"]
    environment: &api-env
      NODE_ENV: development
      SCHEDULER_MODE: external
      DATABASE_URL: postgres://opencompute:${POSTGRES_PASSWORD}@postgres:5432/opencompute
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      S3_ENDPOINT: http://storage:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      OIDC_ISSUER: ${OIDC_ISSUER_BASE:-http://localhost:8081}/realms/opencompute
      OIDC_JWKS_URL: http://identity:8081/realms/opencompute/protocol/openid-connect/certs
      OIDC_AUDIENCE: opencompute-api
      OPERATOR_ID: ${OPERATOR_ID:?Run make configure}
      OPERATOR_NAME: ${OPERATOR_NAME:-OpenCompute}
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build:
      context: .
      dockerfile: deploy/compose/Dockerfile
    environment: *api-env
    ports: ["127.0.0.1:${API_PORT:-8080}:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      nats: { condition: service_started }
      storage: { condition: service_started }
      identity: { condition: service_started }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 60
  scheduler:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    environment:
      API_BASE_URL: http://api:8080
      OIDC_TOKEN_URL: http://identity:8081/realms/opencompute/protocol/openid-connect/token
      OIDC_CLIENT_ID: opencompute-scheduler
      OIDC_CLIENT_SECRET: ${SCHEDULER_CLIENT_SECRET:?Run make configure}
      SCHEDULER_ALLOW_HTTP: "true"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/scheduler", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 30
  console:
    build:
      context: .
      dockerfile: deploy/compose/Dockerfile
    command: ["pnpm", "dev:console"]
    environment:
      API_INTERNAL_URL: http://api:8080
      NEXT_TELEMETRY_DISABLED: "1"
    ports: ["127.0.0.1:${CONSOLE_PORT:-3000}:3000"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  postgres-data:
  nats-data:
  artifact-data:
  identity-data:
